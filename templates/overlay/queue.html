<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Queue</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@700;800&display=swap">
  <link rel="stylesheet" href="/static/css/overlay.css">
</head>
<body class="overlay-body" data-kind="queue" data-key="{{ overlay_key }}" data-style="{{ site.alert_style }}">
  <section id="queue" class="top-box" style="--widget-bg:{{ site.list_bg }};--widget-text:{{ site.list_text }};--fill:{{ site.goal_fill }}">
    <p class="kicker">نوبت حمایت</p>
    <p id="q-emoji" class="alert-emoji"></p>
    <p id="q-name"></p>
    <p id="q-amount" class="alert-amount"></p>
    <p id="q-msg" class="alert-msg"></p>
  </section>
  <script src="/static/js/overlay.js"></script>
</body>
</html>
