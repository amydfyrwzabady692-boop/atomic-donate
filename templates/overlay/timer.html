<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Timer</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@700;800&display=swap">
  <link rel="stylesheet" href="/static/css/overlay.css">
</head>
<body class="overlay-body" data-kind="timer" data-mode="{{ mode }}" data-seconds="{{ seconds }}" data-key="{{ overlay_key }}">
  <section class="donathon">
    <p id="timer-digits" class="digits">00 : 00 : 00</p>
    <div class="hourglass">
      <div class="frame"></div>
      <div class="bulb top"><i></i></div>
      <div class="bulb bot"><i></i></div>
    </div>
    <span class="badge">Atomic Donathon</span>
  </section>
  <script src="/static/js/overlay.js"></script>
</body>
</html>
