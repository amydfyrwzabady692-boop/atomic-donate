<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Alert</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@700;800&display=swap">
  <link rel="stylesheet" href="/static/css/overlay.css">
</head>
<body class="overlay-body" data-kind="alert" data-key="{{ overlay_key }}" data-style="{{ site.alert_style }}" data-volume="{{ site.alert_volume }}" data-tts-volume="{{ site.tts_volume }}">
  <div id="alert" class="alert style-{{ site.alert_style }}" style="--alert-text:{{ site.alert_text }};--name-size:{{ site.alert_name_size }}px">
    <img id="gif" class="alert-gif" alt="">
    <video id="clip" class="alert-gif" muted loop playsinline></video>
    <div class="alert-copy">
      <span id="emoji" class="alert-emoji"></span>
      <p id="who" class="alert-who"></p>
      <p id="amount" class="alert-amount"></p>
      <p id="msg" class="alert-msg"></p>
    </div>
  </div>
  <script src="/static/js/overlay.js"></script>
</body>
</html>
